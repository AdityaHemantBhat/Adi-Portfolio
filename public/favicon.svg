<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Aesthetic dark squircle background with subtle luxury gradient & border -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>
    <!-- Crisp glow behind the monogram -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="1.5" />

  <!-- Inner subtle ambient glow ring -->
  <rect x="4" y="4" width="56" height="56" rx="14" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

  <!-- 
    Architectural Monogram "A" + Modern Editorial Chevron
    Formed with high-contrast geometric precision
  -->
  <g filter="url(#subtleGlow)">
    <!-- Apex & Left Stem -->
    <path 
      d="M32 14L16 46H23L27.5 37H36.5L41 46H48L32 14ZM32 23.2L35 31.5H29L32 23.2Z" 
      fill="url(#markGrad)" 
    />
    
    <!-- Precision Minimalist Accent Dot (Modern Studio Signature) -->
    <circle cx="45" cy="18" r="2.5" fill="#f43f5e" />
  </g>
</svg>

